name: data-contracts

on:
  # Sin filtro de rutas: el check es obligatorio en main y debe reportar en todo PR,
  # o los PRs que no tocan contratos quedarían esperándolo indefinidamente.
  pull_request:
  push:
    branches: [main]
    paths:
      - "alcance/**"
      - "contracts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contratos:
    name: Validar contratos de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para comparar contra la rama base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Data Contract CLI
        run: pip install "datacontract-cli[excel,duckdb,csv]==1.2.2"

      - name: 1 · Documentos de alcance y contratos sincronizados
        run: |
          chmod +x scripts/*.sh
          scripts/excel_a_contrato.sh
          # status --porcelain detecta también contratos nuevos que no se subieron (git diff no los ve)
          if [ -n "$(git status --porcelain -- contracts/)" ]; then
            git status --short -- contracts/
            git diff -- contracts/
            echo "::error::El contrato no coincide con su documento de alcance. Ejecuta scripts/excel_a_contrato.sh y sube el resultado (o corrige los errores que muestra)."
            exit 1
          fi

      - name: 2 · Lint contra ODCS
        run: for c in contracts/*/*.odcs.yaml; do datacontract lint "$c"; done

      - name: 3 · Cambios incompatibles vs rama base
        if: github.event_name == 'pull_request'
        run: scripts/ci_breaking.sh "origin/${{ github.base_ref }}"

      - name: 4 · Test de humo con datos de muestra
        run: |
          for c in contracts/*/*.odcs.yaml; do
            datacontract ci --server local "$c"
          done

      - name: 5 · Generar DDL y documentación
        run: scripts/generar_artefactos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: artefactos-contratos
          path: generated/
